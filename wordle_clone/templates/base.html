<title>Wordle Clone</title>
<link rel="stylesheet" href="{{ url_for('static', filename='style.css')}}">
<nav>
    <h1>Wordle Clone</h1>
</nav>
<section class="content">
    {% for i in range(6) %}
        <div class="row">
            {% for j in range(5) %}
                <div class="{{game_board[1][i][j]}}">{{game_board[0][i][j]}}</div>
            {% endfor %}
        </div>
    {% endfor %}
    <p></p>
    <p>Your guess was:</p>
    {% if  guess is not none %}
        <p>{{ guess }}</p>
    {% endif %}

    <form action="{{ url_for('game.guess') }}" method="post">
        <label for="guess">Guess</label>
        <input name="guess" id="guess" maxlength="5" minlength="5" required>
        <input type="submit" value="Guess">
    </form>

    <form action="{{ url_for('game.reset') }}" method="post">
        <input type="submit" value="Reset">
    </form>
</section>
